[project]
name = "rpera"
version = "0.1.0"
description = "A standalone agent runtime for role-playing adventures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.27,<1",
    "jinja2>=3.1,<4",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
